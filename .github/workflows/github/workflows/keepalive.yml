name: Garder Supabase actif

# Un projet Supabase gratuit est mis en pause après 7 jours sans activité.
# Cet appel régulier l'en empêche.
on:
  schedule:
    - cron: '17 6 * * 1,4' # lundi et jeudi, 6 h 17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la base
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/get_quiz" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive"}'
